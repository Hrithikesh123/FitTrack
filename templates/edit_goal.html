<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Goal - FitTrack</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="container">


    <header>

        <h1>FitTrack 💪</h1>

        <p>Edit your daily goal.</p>


        <nav>

            <a href="/">Dashboard</a>

            <a href="/workouts">Workouts</a>

            <a href="/goals">Goals</a>

            <a href="/progress">Progress</a>

        </nav>

    </header>



    <div class="card">

        <h2>✏️ Edit Goal</h2>


        <form method="POST">


            <input
                type="text"
                name="goal"
                value="{{ goal.goal }}"
                required
            >


            <button type="submit">

                Save Changes

            </button>


        </form>


        <br>


        <a href="/goals">

            <button type="button">

                Cancel

            </button>

        </a>


    </div>


</div>


</body>

</html>
