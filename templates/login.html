<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>FitTrack - Login</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
>
```

</head>

<body>

<div class="container">

```
<div class="card">

    <h1>FitTrack 💪</h1>

    <p>Login to continue.</p>

    {% if error %}

        <p style="color: red;">
            {{ error }}
        </p>

    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        Forgot your password?
        <a href="/reset-password">
            Reset it here
        </a>
    </p>

    <p>
        Don't have an account?
        <a href="/register">
            Create an account
        </a>
    </p>

</div>
```

</div>

</body>

</html>
